<svg fill="none" viewBox="0 0 1000 320" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="1000" height="320">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;family=Orbitron:wght@700;900&amp;display=swap');

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .terminal-box {
          width: 1000px;
          height: 320px;
          background: #080E1A;
          border: 1px solid #1E293B;
          border-radius: 16px;
          overflow: hidden;
          font-family: 'JetBrains Mono', monospace;
          box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 240, 255, 0.08);
          position: relative;
        }

        .term-header {
          background: #0F172A;
          padding: 10px 18px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          border-bottom: 1px solid #1E293B;
        }

        .window-dots {
          display: flex;
          gap: 8px;
        }

        .dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
        }
        .dot-red { background: #EF4444; }
        .dot-yellow { background: #F59E0B; }
        .dot-green { background: #10B981; }

        .term-title {
          font-size: 11px;
          color: #64748B;
          font-weight: 600;
          letter-spacing: 1px;
        }

        .term-body {
          padding: 16px 22px;
          color: #E2E8F0;
          font-size: 12.5px;
          line-height: 1.6;
        }

        .line {
          margin-bottom: 4px;
        }

        .accent-cyan { color: #00F0FF; font-weight: 700; }
        .accent-green { color: #10B981; font-weight: 700; }
        .accent-purple { color: #A855F7; font-weight: 700; }
        .accent-yellow { color: #FBBF24; font-weight: 700; }
        .dim { color: #64748B; }

        .progress-bar-container {
          background: #1E293B;
          height: 8px;
          border-radius: 4px;
          width: 480px;
          display: inline-block;
          margin-left: 8px;
          vertical-align: middle;
          overflow: hidden;
        }

        .progress-fill {
          height: 100%;
          background: linear-gradient(90deg, #00F0FF, #7928CA);
          border-radius: 4px;
          animation: fillBar 4s ease-in-out infinite alternate;
        }

        @keyframes fillBar {
          0% { width: 35%; }
          100% { width: 94%; }
        }

        .badge-live-tag {
          background: rgba(0, 240, 255, 0.15);
          border: 1px solid #00F0FF;
          color: #00F0FF;
          padding: 2px 8px;
          border-radius: 4px;
          font-size: 10px;
          font-weight: 700;
          margin-left: 10px;
        }
      </style>

      <div class="terminal-box">
        <div class="term-header">
          <div class="window-dots">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
          </div>
          <div class="term-title">AP-KERNEL // CRYPTOGRAPHIC THREAT DISPATCH &amp; RADAR TELEMETRY</div>
          <div class="dim" style="font-size: 11px;">v4.1.9-STABLE</div>
        </div>

        <div class="term-body">
          <div class="line">
            <span class="accent-cyan">root@abishek-workstation:~$</span> <span style="color:#FFF;">initialize_telemetry --modules=[PQC, Ransomware, AutonomousAI]</span>
          </div>

          <div class="line dim">[0.0014s] Loading Kyber-1024 polynomial parameters... <span class="accent-green">[ACTIVE - O(N log N)]</span></div>
          <div class="line dim">[0.0038s] Hooking subfolder entropy telemetry daemon... <span class="accent-green">[SHANNON ENTROPY ARMED]</span></div>

          <div class="line" style="margin-top: 8px;">
            <span class="accent-purple">&gt;&gt; ACTIVE DEFENSE RADAR:</span>
            <div class="progress-bar-container">
              <div class="progress-fill"></div>
            </div>
            <span class="badge-live-tag">REAL-TIME SHIELD ENGAGED</span>
          </div>

          <div class="line" style="margin-top: 8px;">
            <span class="accent-yellow">&gt; QUANTUM-DEFENDER:</span> Micro-segmented key rotation ready &bull; Zero server wide blackouts
          </div>
          <div class="line">
            <span class="accent-cyan">&gt; PAYGO FINTECH:</span> RBI Account Aggregator sync active &bull; Llama-3 70B financial guardrails armed
          </div>
          <div class="line">
            <span class="accent-green">&gt; PQMEET VOICE:</span> ML-KEM handshake latency ~24ms &bull; Acoustic biometric spoofing defense active
          </div>
          <div class="line dim" style="margin-top: 6px;">
            <span>[STATUS: READY FOR ENTERPRISE R&amp;D COLLABORATION &bull; INDIA / HYBRID / GLOBAL]</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
