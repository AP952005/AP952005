<svg fill="none" viewBox="0 0 1000 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="1000" height="480">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap');

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .hero-container {
          width: 1000px;
          height: 480px;
          background: #030712;
          position: relative;
          overflow: hidden;
          font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
          border-radius: 20px;
          border: 1px solid rgba(0, 240, 255, 0.25);
          box-shadow: 0 0 50px rgba(0, 240, 255, 0.15), inset 0 0 40px rgba(0, 0, 0, 0.8);
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          padding: 32px 40px;
        }

        /* Animated Cyber Grid Matrix */
        .cyber-grid {
          position: absolute;
          inset: 0;
          background-image: 
            linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
          background-size: 32px 32px;
          perspective: 600px;
          transform: perspective(300px) rotateX(25deg) translateY(-20px);
          transform-origin: top center;
          mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 40%, transparent 80%);
          animation: gridPulse 8s ease-in-out infinite alternate;
          pointer-events: none;
        }

        @keyframes gridPulse {
          0% { opacity: 0.4; }
          100% { opacity: 0.9; }
        }

        /* Glowing Orbs */
        .orb {
          position: absolute;
          border-radius: 50%;
          filter: blur(80px);
          pointer-events: none;
        }
        .orb-cyan {
          width: 320px;
          height: 320px;
          background: rgba(0, 240, 255, 0.18);
          top: -60px;
          right: 40px;
          animation: floatOrb 9s ease-in-out infinite alternate;
        }
        .orb-purple {
          width: 360px;
          height: 360px;
          background: rgba(147, 51, 234, 0.16);
          bottom: -80px;
          left: -40px;
          animation: floatOrb2 11s ease-in-out infinite alternate;
        }

        @keyframes floatOrb {
          0% { transform: translate(0, 0) scale(1); }
          100% { transform: translate(-40px, 40px) scale(1.15); }
        }
        @keyframes floatOrb2 {
          0% { transform: translate(0, 0) scale(1); }
          100% { transform: translate(50px, -30px) scale(1.2); }
        }

        /* Top Bar Header */
        .top-status-bar {
          display: flex;
          justify-content: space-between;
          align-items: center;
          position: relative;
          z-index: 2;
        }

        .terminal-identity {
          display: flex;
          align-items: center;
          gap: 12px;
          background: rgba(15, 23, 42, 0.7);
          border: 1px solid rgba(0, 240, 255, 0.3);
          padding: 6px 14px;
          border-radius: 30px;
          backdrop-filter: blur(10px);
        }

        .pulse-core {
          width: 9px;
          height: 9px;
          background: #00F0FF;
          border-radius: 50%;
          box-shadow: 0 0 12px #00F0FF;
          animation: coreBlink 1.5s infinite;
        }

        @keyframes coreBlink {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.4); opacity: 0.6; }
        }

        .terminal-identity span {
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          color: #94A3B8;
          font-weight: 600;
          letter-spacing: 0.5px;
        }
        .terminal-identity strong {
          color: #00F0FF;
          font-weight: 700;
        }

        .sys-badges {
          display: flex;
          gap: 8px;
        }

        .badge-pill {
          background: rgba(30, 41, 59, 0.6);
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: #E2E8F0;
          padding: 4px 12px;
          border-radius: 20px;
          font-size: 11px;
          font-family: 'JetBrains Mono', monospace;
          font-weight: 600;
          letter-spacing: 0.3px;
        }
        .badge-unisys {
          background: rgba(121, 40, 202, 0.2);
          border-color: #7928CA;
          color: #D8B4FE;
        }
        .badge-pqc {
          background: rgba(0, 240, 255, 0.15);
          border-color: #00F0FF;
          color: #67E8F9;
        }

        /* Center Content Area */
        .hero-center {
          position: relative;
          z-index: 2;
          margin-top: 10px;
        }

        .title-pre {
          font-family: 'JetBrains Mono', monospace;
          font-size: 13px;
          color: #00F0FF;
          text-transform: uppercase;
          letter-spacing: 3px;
          font-weight: 700;
          margin-bottom: 6px;
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .title-pre::before {
          content: '';
          display: inline-block;
          width: 20px;
          height: 2px;
          background: #00F0FF;
          box-shadow: 0 0 8px #00F0FF;
        }

        .main-headline {
          font-family: 'Orbitron', sans-serif;
          font-size: 44px;
          font-weight: 900;
          letter-spacing: -0.5px;
          line-height: 1.1;
          background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 40%, #00F0FF 80%, #7928CA 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          text-shadow: 0 0 35px rgba(0, 240, 255, 0.45);
        }

        /* Animated Terminal Typewriter Line */
        .type-line-wrapper {
          display: flex;
          align-items: center;
          gap: 8px;
          margin-top: 14px;
          background: rgba(15, 23, 42, 0.85);
          border-left: 3px solid #00F0FF;
          padding: 8px 16px;
          border-radius: 0 10px 10px 0;
          width: fit-content;
          border-top: 1px solid rgba(255, 255, 255, 0.05);
          border-right: 1px solid rgba(255, 255, 255, 0.05);
          border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cli-prompt {
          font-family: 'JetBrains Mono', monospace;
          font-size: 13px;
          color: #38BDF8;
          font-weight: 700;
        }

        .type-animated {
          font-family: 'JetBrains Mono', monospace;
          font-size: 13.5px;
          color: #F8FAFC;
          font-weight: 600;
          display: inline-block;
          white-space: nowrap;
          overflow: hidden;
          border-right: 2px solid #00F0FF;
          width: 0;
          animation: typingCycle 10s steps(55, end) infinite, blinkCaret 0.75s step-end infinite;
        }

        @keyframes typingCycle {
          0%, 5% { width: 0; }
          30%, 45% { width: 52ch; }
          50%, 55% { width: 0; }
          80%, 95% { width: 55ch; }
          100% { width: 0; }
        }

        @keyframes blinkCaret {
          from, to { border-color: transparent; }
          50% { border-color: #00F0FF; }
        }

        /* Telemetry Quad Stats at Bottom */
        .stats-quad {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 14px;
          position: relative;
          z-index: 2;
        }

        .stat-card {
          background: rgba(15, 23, 42, 0.65);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 14px;
          padding: 12px 16px;
          backdrop-filter: blur(12px);
          position: relative;
          overflow: hidden;
        }

        .stat-card::before {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 2px;
          background: linear-gradient(90deg, transparent, var(--border-glow, #00F0FF), transparent);
        }

        .stat-card:nth-child(1) { --border-glow: #00F0FF; }
        .stat-card:nth-child(2) { --border-glow: #7928CA; }
        .stat-card:nth-child(3) { --border-glow: #10B981; }
        .stat-card:nth-child(4) { --border-glow: #F59E0B; }

        .stat-label {
          font-family: 'JetBrains Mono', monospace;
          font-size: 10px;
          color: #94A3B8;
          text-transform: uppercase;
          letter-spacing: 1px;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .stat-val {
          font-family: 'Orbitron', sans-serif;
          font-size: 19px;
          font-weight: 800;
          color: #FFFFFF;
          margin-top: 4px;
          letter-spacing: -0.5px;
        }

        .stat-val span {
          color: #00F0FF;
          font-size: 12px;
          font-family: 'JetBrains Mono', monospace;
        }

        /* Scanline Overlay Effect */
        .scanline-layer {
          position: absolute;
          inset: 0;
          background: linear-gradient(
            rgba(18, 16, 16, 0) 50%, 
            rgba(0, 0, 0, 0.25) 50%
          );
          background-size: 100% 4px;
          pointer-events: none;
          z-index: 10;
          opacity: 0.5;
        }
      </style>

      <div class="hero-container">
        <div class="cyber-grid"></div>
        <div class="orb orb-cyan"></div>
        <div class="orb orb-purple"></div>
        <div class="scanline-layer"></div>

        <!-- Top Status Bar -->
        <div class="top-status-bar">
          <div class="terminal-identity">
            <div class="pulse-core"></div>
            <span>NODE // <strong>AP-9505.CORP.UNISYS</strong></span>
          </div>

          <div class="sys-badges">
            <div class="badge-pill badge-unisys">🏢 UNISYS ASSOCIATE ENG</div>
            <div class="badge-pill badge-pqc">🔒 PQC &amp; CRYPTO LABS</div>
            <div class="badge-pill">⚡ AUTONOMOUS AI</div>
          </div>
        </div>

        <!-- Center Headline & Animated Typing -->
        <div class="hero-center">
          <div class="title-pre">CYBERSPACE PROTOCOL &bull; RESEARCH ARCHITECT</div>
          <div class="main-headline">ABISHEK PALANI S.</div>

          <div class="type-line-wrapper">
            <span class="cli-prompt">SYS:~$</span>
            <span class="type-animated">pqc_keygen --algo=ML-KEM-1024 &amp;&amp; deploy_ai_guardrails()</span>
          </div>
        </div>

        <!-- Bottom 4 Telemetry Metrics -->
        <div class="stats-quad">
          <div class="stat-card">
            <div class="stat-label">🛡️ CRYPTO THREAT TIME</div>
            <div class="stat-val">&lt; 1.5s <span>ISOLATION</span></div>
          </div>

          <div class="stat-card">
            <div class="stat-label">🔐 PQC PROTOCOL</div>
            <div class="stat-val">CRYSTALS <span>KYBER</span></div>
          </div>

          <div class="stat-card">
            <div class="stat-label">🤖 AI ACCELERATION</div>
            <div class="stat-val">LLAMA-3 <span>70B GROQ</span></div>
          </div>

          <div class="stat-card">
            <div class="stat-label">🌐 SPECIALIZATION</div>
            <div class="stat-val">DEFENSE <span>&amp; WEB3</span></div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
